<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portico | BRD Tool v1.8</title>
<style>
:root{
  --gold:#F1C400;--gray:#54585A;--blue:#009CDE;--orange:#D86018;
  --green:#A2AD00;--red:#C5003E;--lgray:#F4F4F4;--mgray:#D0D7DE;
  --dgray:#3A3A3A;--navy:#2E3A4E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',sans-serif;font-size:14px;color:var(--dgray);background:#EEF1F4;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOP BAR ── */
.topbar{background:var(--gray);padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tb-left{display:flex;align-items:center;gap:14px}
.tb-logo{color:var(--gold);font-size:18px;font-weight:800;letter-spacing:3px}
.tb-title{color:#ccc;font-size:12px}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.tb-saved{background:rgba(162,173,0,.25);color:var(--green);opacity:0;transition:opacity .4s}
.tb-saved.show{opacity:1}

/* ── STEP BAR ── */
.stepbar{background:var(--lgray);border-bottom:1px solid var(--mgray);padding:0 20px;height:44px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.step-item{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#999;transition:all .15s}
.step-item.active{background:var(--blue);color:#fff}
.step-item.done{color:var(--green)}
.step-item .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#ddd;color:#999;flex-shrink:0}
.step-item.active .dot{background:rgba(255,255,255,.3);color:#fff}
.step-item.done .dot{background:var(--green);color:#fff}
.step-div{width:20px;height:1px;background:var(--mgray)}

/* ── MAIN LAYOUT ── */
.workspace{display:flex;flex:1;overflow:hidden}
.left-panel{width:420px;flex-shrink:0;overflow-y:auto;background:#fff;border-right:1px solid var(--mgray);display:flex;flex-direction:column}
.right-panel{flex:1;overflow-y:auto;background:var(--lgray);padding:20px}

/* ── LEFT PANEL: FORM ── */
.form-section{padding:16px 16px 0;border-bottom:1px solid var(--lgray)}
.form-section:last-child{border-bottom:none;padding-bottom:16px}
.section-label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:10px}
.field-group{margin-bottom:12px}
.field-group label{display:block;font-size:11px;font-weight:700;color:var(--gray);margin-bottom:4px}
.field-group input,.field-group textarea,.field-group select{
  width:100%;border:1.5px solid var(--mgray);border-radius:5px;
  padding:7px 9px;font-family:inherit;font-size:12px;color:var(--dgray);
  background:#fff;outline:none;transition:border-color .15s;resize:vertical
}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{border-color:var(--blue);background:#f8fcff}
.field-group textarea{min-height:60px;line-height:1.4}
.scope-list{display:flex;flex-direction:column;gap:5px}
.scope-row{display:flex;gap:5px}
.scope-row input{flex:1}
.scope-row button{padding:0 8px;border:1px solid var(--mgray);border-radius:4px;background:none;cursor:pointer;color:#999;font-size:14px}
.scope-row button:hover{color:var(--red);border-color:var(--red)}
.add-item-btn{margin-top:6px;background:none;border:1.5px dashed var(--blue);border-radius:5px;padding:5px;width:100%;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.add-item-btn:hover{background:#f0f9ff}

/* ── BOTTOM ACTIONS ── */
.panel-actions{padding:12px 16px;border-top:1px solid var(--mgray);background:#fff;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;width:100%}
.btn-blue{background:var(--blue);color:#fff}
.btn-gold{background:var(--gold);color:var(--gray)}
.btn-gray{background:none;border:1.5px solid var(--mgray);color:var(--gray)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{width:auto;padding:6px 12px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── RIGHT PANEL: PREVIEW ── */
.preview-card{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px 36px;max-width:780px;margin:0 auto}
.preview-empty{text-align:center;padding:60px 20px;color:#aaa}
.preview-empty .icon{font-size:48px;margin-bottom:16px}
.preview-empty p{font-size:14px}

/* ── BRD PREVIEW STYLES ── */
.brd-cover{background:var(--navy);padding:28px;border-radius:4px;margin-bottom:20px;text-align:center}
.brd-cover h1{color:var(--gold);font-size:22px;font-weight:800;letter-spacing:1px}
.brd-cover h2{color:var(--gold);font-size:16px;font-weight:600;margin-top:4px}
.brd-cover p{color:#ccc;font-size:12px;margin-top:8px}
.brd-section{margin-bottom:24px}
.brd-section-hdr{display:flex;gap:0;margin-bottom:12px;border-radius:3px;overflow:hidden}
.brd-section-num{background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;min-width:36px;text-align:center}
.brd-section-title{background:#D6E4F0;color:var(--navy);font-weight:700;font-size:13px;padding:8px 14px;letter-spacing:1px;flex:1}
.brd-subhdr{color:var(--blue);font-weight:700;font-size:13px;margin:12px 0 6px;border-bottom:2px solid var(--blue);padding-bottom:3px}
.brd-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12px}
.brd-table th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font-weight:700;border:1px solid var(--mgray)}
.brd-table td{padding:7px 10px;border:1px solid var(--mgray);vertical-align:top}
.brd-table tr:nth-child(even) td{background:#f8f8f8}
.brd-table .label{background:#f2f2f2;font-weight:700;width:28%;color:var(--gray)}
.brd-context{background:#f0fff4;border-left:3px solid var(--green);padding:8px;margin-top:6px;font-size:11px;border-radius:2px}
.brd-context strong{color:var(--green)}
.brd-bullet{padding-left:20px;font-size:12px;line-height:1.6;color:#444}
.brd-bullet li{margin-bottom:3px}
.empty-val{color:#bbb;font-style:italic}
.req-block{border:1px solid var(--mgray);border-radius:5px;overflow:hidden;margin-bottom:10px}
.req-block-hdr{background:var(--gray);color:#fff;font-weight:700;font-size:12px;padding:6px 10px}

/* ── DOCUMENT TAB (upload/paste) ── */
.doc-item{border:1px solid var(--mgray);border-radius:5px;padding:8px;margin-bottom:6px;background:var(--lgray);display:flex;gap:8px;align-items:flex-start}
.doc-item-name{font-size:12px;font-weight:700;flex:1}
.doc-item-meta{font-size:10px;color:#999}
.doc-item-remove{background:none;border:none;cursor:pointer;color:#bbb;font-size:14px;padding:0 2px}
.doc-item-remove:hover{color:var(--red)}
.drop-zone{border:2px dashed var(--blue);border-radius:8px;padding:20px;text-align:center;background:#f8fcff;cursor:pointer;transition:all .15s}
.drop-zone:hover{background:#f0f6ff}
.drop-zone p{font-size:12px;color:#888;margin-top:6px}
.integrate-notice{background:#f0fff4;border-left:3px solid var(--green);border-radius:4px;padding:8px 10px;font-size:11px;color:#3a4200;margin-top:8px}

/* ── REQ / NFR sub-tabs ── */
.subtabs{display:flex;gap:4px;margin-bottom:12px}
.subtab{padding:5px 12px;border-radius:16px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;background:#eee;color:#888;transition:all .15s}
.subtab.active{background:var(--blue);color:#fff}

/* ── SAVED LIST ── */
.saved-item{border:1px solid var(--mgray);border-radius:5px;padding:9px 12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#fff;transition:all .15s}
.saved-item:hover{border-color:var(--blue);background:#f8fcff}
.saved-item-name{font-size:13px;font-weight:700;color:var(--dgray)}
.saved-item-meta{font-size:11px;color:#999}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-left">
    <span class="tb-logo">PORTICO</span>
    <span class="tb-title">Business Requirements Document Tool v1.8</span>
  </div>
  <div class="tb-right">
    <span class="tb-saved tb-badge" id="save-ind">✓ Saved</span>
    <button class="btn btn-gray btn-sm" onclick="newDocument()">+ New BRD</button>
    <button class="btn btn-gold btn-sm" onclick="generateAndDownload()">⬇ Download BRD</button>
  </div>
</div>

<!-- STEP BAR -->
<div class="stepbar">
  <div class="step-item active" id="step-1" onclick="gotoStep(1)">
    <div class="dot">1</div>Canvas Data
  </div>
  <div class="step-div"></div>
  <div class="step-item" id="step-2" onclick="gotoStep(2)">
    <div class="dot">2</div>Scope & Stakeholders
  </div>
  <div class="step-div"></div>
  <div class="step-item" id="step-3" onclick="gotoStep(3)">
    <div class="dot">3</div>Requirements
  </div>
  <div class="step-div"></div>
  <div class="step-item" id="step-4" onclick="gotoStep(4)">
    <div class="dot">4</div>Business Documents
  </div>
  <div class="step-div"></div>
  <div class="step-item" id="step-5" onclick="gotoStep(5)">
    <div class="dot">5</div>Saved BRDs
  </div>
</div>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div id="left-content" style="flex:1;overflow-y:auto"></div>
    <div class="panel-actions" id="panel-actions"></div>
  </div>

  <!-- RIGHT PANEL: LIVE PREVIEW -->
  <div class="right-panel">
    <div id="preview-area">
      <div class="preview-empty">
        <div class="icon">📋</div>
        <p>Fill in the fields and click<br><strong>Generate Document</strong></p>
        <p style="margin-top:8px;font-size:12px">The requirements document will appear here, ready to download.</p>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let S = {
  title:'', sponsor:'', docOwner:'', businessUnit:'', version:'1.0 DRAFT',
  objective:'', problem:'', audience:'', userCount:'', roiValue:'', successMetrics:'',
  moscow:'', targetDate:'', dependencies:'', vision:'', strategy:'',
  inScope:['','',''], outScope:['',''],
  stakeholders:[{name:'',type:'Sponsor',involvement:'Approver',commsNeeds:'Executive summary updates'}],
  requirements:[{id:'BRD-001',title:'',priority:'High',description:'',businessValue:'',acceptanceCriteria:'',actors:'',stakeholder:'',businessContext:[]}],
  nfrs:[{category:'Availability',requirement:'',priority:'High'},{category:'Security',requirement:'',priority:'High'},{category:'Performance',requirement:'',priority:'Medium'}],
  constraints:['',''],
  businessDocuments:[],
  glossary:[{term:'SME',definition:'Subject Matter Expert'},{term:'UAT',definition:'User Acceptance Testing'},{term:'BRD',definition:'Business Requirements Document'}]
};

let currentStep = 1;
const STORE_KEY = 'portico-brd-v18';
const SAVED_KEY = 'portico-brd-saved-v18';

function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(S));
  const el = document.getElementById('save-ind');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1600);
}

function loadState(){
  try{
    const d = localStorage.getItem(STORE_KEY);
    if(d) S = {...S, ...JSON.parse(d)};
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════════════════════
// SMARTSHEET PASTE EXTRACTION
// ══════════════════════════════════════════════════════════════════════════════
function extractFromPaste(){
  const text = document.getElementById('ss-paste').value.trim();
  if(!text){ alert('Paste your Smartsheet data first'); return; }

  const lines = text.split('\n');
  const pairs = {};
  const headers = lines[0]?.split('\t');
  const values  = lines[1]?.split('\t');

  if(headers && values && headers.length === values.length){
    headers.forEach((h,i) => { pairs[h.trim().toLowerCase()] = values[i]?.trim() || ''; });
  } else {
    lines.forEach(line => {
      const [k,...rest] = line.split(/:\t|\t/);
      if(k && rest.length) pairs[k.trim().toLowerCase()] = rest.join('\t').trim();
    });
    // also try to match anything
    lines.forEach(line => {
      const m = line.match(/^(.+?)\s{2,}(.+)$/);
      if(m) pairs[m[1].trim().toLowerCase()] = m[2].trim();
    });
  }

  const get = (...keys) => {
    for(const k of keys){
      for(const pk of Object.keys(pairs)){
        if(pk.includes(k) || k.includes(pk)) return pairs[pk];
      }
    }
    return '';
  };

  S.title         = get('title','opportunity','name') || S.title;
  S.sponsor       = get('sponsor') || S.sponsor;
  S.targetDate    = get('date','deadline','due') || S.targetDate;
  S.objective     = get('objective','business obj') || S.objective;
  S.problem       = get('problem','problem to solve','solving') || S.problem;
  S.audience      = get('who','audience','solving for') || S.audience;
  S.userCount     = get('user count','how many','number of') || S.userCount;
  S.roiValue      = get('roi','value','targeted value','cost') || S.roiValue;
  S.successMetrics= get('success','metric','measure') || S.successMetrics;
  S.moscow        = get('moscow','priority','must') || S.moscow;
  S.vision        = get('vision','future state','future') || S.vision;
  S.dependencies  = get('depend') || S.dependencies;
  S.strategy      = get('strategy') || S.strategy;

  renderStep(1);
  refreshPreview();
  saveState();
  alert('✓ Data extracted! Review and edit the fields on the left.');
}

// ══════════════════════════════════════════════════════════════════════════════
// STEP RENDERING
// ══════════════════════════════════════════════════════════════════════════════
function gotoStep(n){
  currentStep = n;
  document.querySelectorAll('.step-item').forEach((el,i)=>{
    el.classList.toggle('active', i+1 === n);
    el.classList.toggle('done', i+1 < n);
  });
  renderStep(n);
}

function renderStep(n){
  const lc = document.getElementById('left-content');
  const pa = document.getElementById('panel-actions');

  switch(n){
    case 1: lc.innerHTML = step1HTML(); pa.innerHTML = step1Actions(); break;
    case 2: lc.innerHTML = step2HTML(); pa.innerHTML = step2Actions(); break;
    case 3: lc.innerHTML = step3HTML(); pa.innerHTML = step3Actions(); break;
    case 4: lc.innerHTML = step4HTML(); pa.innerHTML = step4Actions(); break;
    case 5: lc.innerHTML = step5HTML(); pa.innerHTML = step5Actions(); break;
  }
  refreshPreview();
}

// ── STEP 1: Canvas Data ───────────────────────────────────────────────────────
function step1HTML(){
  return `
  <div class="form-section">
    <div class="section-label">Import from Smartsheet</div>
    <div class="field-group">
      <label>Paste Smartsheet row (headers + data, or any key:value format)</label>
      <textarea id="ss-paste" rows="5" placeholder="Paste Smartsheet data here..."></textarea>
    </div>
    <button class="btn btn-blue" onclick="extractFromPaste()">⚡ Extract Fields</button>
  </div>

  <div class="form-section">
    <div class="section-label">Project Header</div>
    <div class="field-group"><label>Opportunity / Project Title</label>
      <input value="${esc(S.title)}" oninput="S.title=this.value;refresh()" placeholder="e.g. Contribution Share Digitization"></div>
    <div class="field-group"><label>Sponsor(s)</label>
      <input value="${esc(S.sponsor)}" oninput="S.sponsor=this.value;refresh()" placeholder="e.g. Jeff Ryan"></div>
    <div class="field-group"><label>Document Owner (BA/PM)</label>
      <input value="${esc(S.docOwner)}" oninput="S.docOwner=this.value;refresh()" placeholder="Your name"></div>
    <div class="field-group"><label>Business Unit</label>
      <input value="${esc(S.businessUnit)}" oninput="S.businessUnit=this.value;refresh()" placeholder="e.g. Service Delivery Operations"></div>
    <div class="field-group"><label>Target Date / Deadline</label>
      <input value="${esc(S.targetDate)}" oninput="S.targetDate=this.value;refresh()" placeholder="e.g. 10/01/2026"></div>
    <div class="field-group"><label>MoSCoW Priority</label>
      <select oninput="S.moscow=this.value;refresh()">
        ${['Must Have','Should Have','Could Have','Won\'t Have'].map(v=>`<option ${S.moscow===v?'selected':''}>${v}</option>`).join('')}
      </select></div>
    <div class="field-group"><label>Version</label>
      <input value="${esc(S.version)}" oninput="S.version=this.value;refresh()" placeholder="1.0 DRAFT"></div>
  </div>

  <div class="form-section">
    <div class="section-label">Problem & Objective</div>
    <div class="field-group"><label>Business Objective</label>
      <textarea oninput="S.objective=this.value;refresh()" placeholder="What business goal does this support?">${esc(S.objective)}</textarea></div>
    <div class="field-group"><label>Problem to Solve</label>
      <textarea oninput="S.problem=this.value;refresh()" placeholder="What problem are we solving?">${esc(S.problem)}</textarea></div>
    <div class="field-group"><label>Who We're Solving For</label>
      <textarea rows="2" oninput="S.audience=this.value;refresh()" placeholder="e.g. Large & Small Flex employers...">${esc(S.audience)}</textarea></div>
    <div class="field-group"><label>Number of Users / Groups Affected</label>
      <input value="${esc(S.userCount)}" oninput="S.userCount=this.value;refresh()" placeholder="e.g. ~500 employers annually"></div>
    <div class="field-group"><label>Future State Vision</label>
      <textarea oninput="S.vision=this.value;refresh()" placeholder="What does success look like?">${esc(S.vision)}</textarea></div>
    <div class="field-group"><label>Targeted Value / ROI</label>
      <textarea rows="2" oninput="S.roiValue=this.value;refresh()" placeholder="Expected cost savings, efficiency gains...">${esc(S.roiValue)}</textarea></div>
    <div class="field-group"><label>Success Metrics</label>
      <textarea rows="2" oninput="S.successMetrics=this.value;refresh()" placeholder="How will we measure success?">${esc(S.successMetrics)}</textarea></div>
    <div class="field-group"><label>Known Dependencies</label>
      <textarea rows="2" oninput="S.dependencies=this.value;refresh()" placeholder="Systems, teams, timelines...">${esc(S.dependencies)}</textarea></div>
  </div>`;
}
function step1Actions(){ return `<button class="btn btn-blue" onclick="gotoStep(2)">Next: Scope & Stakeholders →</button>`; }

// ── STEP 2: Scope & Stakeholders ──────────────────────────────────────────────
function step2HTML(){
  const inRows  = S.inScope.map((v,i)=>`<div class="scope-row"><input value="${esc(v)}" oninput="S.inScope[${i}]=this.value;refresh()" placeholder="In-scope item ${i+1}"><button onclick="removeScope('in',${i})">×</button></div>`).join('');
  const outRows = S.outScope.map((v,i)=>`<div class="scope-row"><input value="${esc(v)}" oninput="S.outScope[${i}]=this.value;refresh()" placeholder="Out-of-scope item ${i+1}"><button onclick="removeScope('out',${i})">×</button></div>`).join('');

  const stRows = S.stakeholders.map((s,i)=>`
    <div style="border:1px solid var(--mgray);border-radius:5px;padding:10px;margin-bottom:8px;background:#fafafa">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <strong style="font-size:11px;color:var(--gray)">Stakeholder ${i+1}</strong>
        ${i>0?`<button onclick="removeStakeholder(${i})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:12px">Remove</button>`:''}
      </div>
      <div class="field-group"><label>Name / Role</label><input value="${esc(s.name)}" oninput="S.stakeholders[${i}].name=this.value;refresh()"></div>
      <div class="field-group"><label>Type</label>
        <select onchange="S.stakeholders[${i}].type=this.value;refresh()">
          ${['Sponsor','Business Owner','BA/PM','Developer','SME','End User'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="field-group"><label>Involvement</label>
        <select onchange="S.stakeholders[${i}].involvement=this.value;refresh()">
          ${['Approver','Owner','Contributor','Informed'].map(t=>`<option ${s.involvement===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="field-group"><label>Communication Needs</label><input value="${esc(s.commsNeeds)}" oninput="S.stakeholders[${i}].commsNeeds=this.value;refresh()"></div>
    </div>`).join('');

  return `
  <div class="form-section">
    <div class="section-label">Project Scope</div>
    <div class="field-group">
      <label>✅ In-Scope Items</label>
      <div class="scope-list">${inRows}</div>
      <button class="add-item-btn" onclick="addScope('in')">+ Add In-Scope Item</button>
    </div>
    <div class="field-group">
      <label>🚫 Out-of-Scope Items</label>
      <div class="scope-list">${outRows}</div>
      <button class="add-item-btn" onclick="addScope('out')">+ Add Out-of-Scope Item</button>
    </div>
  </div>
  <div class="form-section">
    <div class="section-label">Constraints & Assumptions</div>
    ${S.constraints.map((c,i)=>`<div class="scope-row" style="margin-bottom:6px"><input value="${esc(c)}" oninput="S.constraints[${i}]=this.value;refresh()" placeholder="Constraint or assumption ${i+1}"><button onclick="S.constraints.splice(${i},1);renderStep(2)" style="background:none;border:1px solid var(--mgray);border-radius:4px;cursor:pointer;color:#999;font-size:14px">×</button></div>`).join('')}
    <button class="add-item-btn" onclick="S.constraints.push('');renderStep(2)">+ Add Constraint</button>
  </div>
  <div class="form-section">
    <div class="section-label">Stakeholders & Roles</div>
    ${stRows}
    <button class="add-item-btn" onclick="addStakeholder()">+ Add Stakeholder</button>
  </div>`;
}

// DOCUMENT ACTIONS
// ══════════════════════════════════════════════════════════════════════════════
function addDocFromPaste(){
  const name    = document.getElementById('doc-name').value.trim();
  const content = document.getElementById('doc-text').value.trim();
  if(!name||!content){ alert('Please enter a document name and content'); return; }
  S.businessDocuments.push({ name, content, addedDate: new Date().toISOString() });
  renderStep(4);
}

function addDocFromFile(input){
  const file = input.files[0];
  if(!file) return;
  const name = document.getElementById('doc-name').value.trim() || file.name;
  const reader = new FileReader();
  reader.onload = e => {
    S.businessDocuments.push({ name, content: e.target.result, addedDate: new Date().toISOString() });
    renderStep(4);
  };
  reader.readAsText(file);
}

function removeDoc(i){
  S.businessDocuments.splice(i,1);
  S.requirements.forEach(r => r.businessContext = []);
  renderStep(4);
}

function integrateDocuments(){
  if(S.businessDocuments.length === 0){ alert('Add documents first'); return; }
  S.requirements.forEach(req => {
    req.businessContext = [];
    const keywords = [req.title, req.description, req.businessValue, req.acceptanceCriteria]
      .filter(Boolean).join(' ').toLowerCase().split(/\s+/).filter(w => w.length > 4);
    S.businessDocuments.forEach(doc => {
      const lines = doc.content.split('\n');
      const scored = lines.filter(l => l.trim().length > 15).map(line => {
        const ll = line.toLowerCase();
        const score = keywords.filter(k => ll.includes(k)).length;
        return { text: line.trim().substring(0,200), score, doc: doc.name };
      }).filter(l => l.score > 0).sort((a,b) => b.score - a.score);
      if(scored.length > 0) req.businessContext.push(...scored.slice(0,2));
    });
  });
  renderStep(4);
  alert('✓ Documents integrated into requirements!');
}

// ══════════════════════════════════════════════════════════════════════════════
// SAVE / LOAD
// ══════════════════════════════════════════════════════════════════════════════
function getSavedList(){
  try{ return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]'); }catch(e){ return []; }
}

function saveCurrentBRD(){
  const name = prompt('Save BRD as:', S.title || 'New BRD');
  if(!name) return;
  S.title = S.title || name;
  const saved = getSavedList();
  saved.unshift({ ...JSON.parse(JSON.stringify(S)), savedDate: new Date().toISOString() });
  localStorage.setItem(SAVED_KEY, JSON.stringify(saved.slice(0, 20)));
  alert(`✓ Saved as "${name}"`);
  gotoStep(5);
}

function loadSaved(i){
  const saved = getSavedList();
  if(saved[i]){ S = {...S, ...saved[i]}; gotoStep(1); refreshPreview(); }
}

function downloadSaved(i){
  const saved = getSavedList();
  if(saved[i]){ S = {...S, ...saved[i]}; generateAndDownload(); }
}

function deleteSaved(i){
  if(!confirm('Delete this saved BRD?')) return;
  const saved = getSavedList();
  saved.splice(i,1);
  localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
  renderStep(5);
}
