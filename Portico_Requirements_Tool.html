<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements Document Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #1E3A5F;
  --slate:  #2C4A6E;
  --mid:    #4A6FA5;
  --accent: #2E86AB;
  --teal:   #1A7A6E;
  --amber:  #C47A1B;
  --crimson:#9B2335;
  --sage:   #4A7C59;
  --bg:     #F0F2F5;
  --card:   #FFFFFF;
  --border: #D1D9E0;
  --text:   #1A2332;
  --muted:  #6B7A8D;
  --light:  #F7F9FC;
  --success:#2E7D52;
}

body { font-family: 'Segoe UI', Calibri, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── LAYOUT ── */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  background: var(--navy);
  padding: 0 28px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-brand { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
.topbar-sub { font-size: 12px; color: rgba(255,255,255,.55); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.save-badge { font-size: 11px; color: #6FD09B; font-weight: 600; opacity: 0; transition: opacity .4s; }
.save-badge.show { opacity: 1; }

/* ── PROGRESS ── */
.progress-bar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  height: 60px;
  gap: 0;
}
.step-item {
  display: flex;
  align-items: center;
  flex: 1;
  gap: 0;
}
.step-dot {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
  transition: all .2s;
}
.step-dot.done { background: var(--teal); color: #fff; cursor: pointer; }
.step-dot.active { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px rgba(46,134,171,.25); }
.step-dot.pending { background: #E0E6EE; color: var(--muted); }
.step-label { font-size: 11px; font-weight: 600; margin-left: 8px; white-space: nowrap; }
.step-label.done { color: var(--teal); }
.step-label.active { color: var(--accent); }
.step-label.pending { color: var(--muted); }
.step-line { flex: 1; height: 2px; background: #E0E6EE; margin: 0 8px; }
.step-line.done { background: var(--teal); }

/* ── MAIN CONTENT ── */
.main { flex: 1; padding: 28px; max-width: 1000px; margin: 0 auto; width: 100%; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 28px;
  margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

.section-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent); margin-bottom: 16px;
}
.section-label::after { content: ''; display: block; width: 40px; height: 2px; background: var(--accent); border-radius: 1px; }

.field-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 5px; text-transform: uppercase; }
.field-group { margin-bottom: 14px; }

input, select, textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: 6px;
  padding: 8px 12px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--card); outline: none;
  transition: border-color .15s, box-shadow .15s;
  line-height: 1.5;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46,134,171,.12);
}
textarea { resize: vertical; }
select { cursor: pointer; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* ── BUTTONS ── */
.btn {
  border: none; border-radius: 6px; padding: 10px 22px;
  font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: all .15s; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--slate); }
.btn-primary:disabled { background: #A0B0C0; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: #1a6a87; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost { background: transparent; border: 1.5px dashed var(--border); color: var(--muted); font-size: 12px; padding: 7px 14px; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger-outline { background: transparent; border: 1.5px solid var(--border); color: var(--crimson); font-size: 11px; padding: 4px 10px; }
.btn-danger-outline:hover { border-color: var(--crimson); background: #FFF5F5; }
.btn-save { background: #EAF6F0; border: 1.5px solid var(--teal); color: var(--teal); }
.btn-save:hover { background: var(--teal); color: #fff; }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; }
.tab {
  padding: 7px 14px; border-radius: 6px; border: 1.5px solid var(--border);
  font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card);
  color: var(--muted); transition: all .15s; font-family: inherit;
}
.tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ── SUBCARD ── */
.subcard {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px;
}
.subcard-header {
  padding: 10px 16px; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: space-between;
}
.subcard-body { padding: 16px; background: var(--light); }

/* ── CALLOUT ── */
.callout {
  border-radius: 6px; padding: 12px 16px; font-size: 13px;
  margin-bottom: 18px; line-height: 1.6; border-left: 4px solid;
}
.callout-info { background: #EBF4FA; border-color: var(--accent); color: #1A3A4F; }
.callout-warn { background: #FDF6EC; border-color: var(--amber); color: #4A3010; }
.callout-success { background: #EAF6EF; border-color: var(--teal); color: #1A3A2A; }
.callout-error { background: #FCECEA; border-color: var(--crimson); color: #4A1010; }

/* ── PASTE BOX ── */
.paste-area {
  width: 100%; min-height: 120px; border: 2px dashed var(--border);
  border-radius: 8px; padding: 16px; font-size: 12px; font-family: 'Courier New', monospace;
  color: var(--muted); background: var(--light); resize: vertical;
  transition: border-color .15s;
}
.paste-area:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(46,134,171,.1); }

/* ── STATS ── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--light); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; border-top: 3px solid; }
.stat-num { font-size: 28px; font-weight: 800; }
.stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 3px; letter-spacing: 0.5px; }

/* ── SCOPE ITEM ── */
.scope-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.scope-row input { flex: 1; }

/* ── ERROR ── */
.error-box { background: #FCECEA; border: 1px solid var(--crimson); border-radius: 6px; padding: 10px 14px; color: var(--crimson); font-size: 13px; margin-top: 12px; }

/* ── UPLOAD MSG ── */
.upload-msg { border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-top: 12px; border: 1px solid; }
.upload-ok { background: #EAF6EF; border-color: var(--teal); color: var(--teal); }
.upload-err { background: #FCECEA; border-color: var(--crimson); color: var(--crimson); }

/* ── INPUT METHOD TOGGLE ── */
.method-toggle { display: flex; gap: 0; margin-bottom: 20px; border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden; }
.method-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--light); color: var(--muted); transition: all .15s; border: none; font-family: inherit; }
.method-btn.active { background: var(--navy); color: #fff; }
.method-btn:hover:not(.active) { background: #E8EFF6; }
</style>
</head>
<body>
<div class="shell" id="app">
  <!-- Rendered by JS -->
</div>

<script>
// ═══════════════════════════════════════════════════════
// PALETTE — generic professional (no org-specific colors)
// ═══════════════════════════════════════════════════════
const C = {
  navy:"#1E3A5F", slate:"#2C4A6E", mid:"#4A6FA5", accent:"#2E86AB",
  teal:"#1A7A6E", amber:"#C47A1B", crimson:"#9B2335", sage:"#4A7C59",
  gray:"#6B7A8D", lgray:"#F7F9FC", mgray:"#D1D9E0", dgray:"#1A2332", white:"#FFFFFF"
};

// ═══════════════════════════════════════════════════════
// CANVAS FIELD DEFINITIONS — all columns from Smartsheet schema
// ═══════════════════════════════════════════════════════
const CANVAS_FIELDS = [
  { id:"title",         label:"Opportunity Title",              aliases:["opportunity title","title"],                   multi:false },
  { id:"execSummary",   label:"Executive Summary",              aliases:["executive summary","summary"],                 multi:true  },
  { id:"reqType",       label:"Request Type",                   aliases:["request type","type","initiative","enhancement","defect","incident"], multi:false },
  { id:"initiativeName",label:"Initiative Name",                aliases:["initiative name","initiative"],                multi:false },
  { id:"domain",        label:"Domain",                         aliases:["domain"],                                      multi:false },
  { id:"capability",    label:"Capability",                     aliases:["capability"],                                  multi:false },
  { id:"sdTicket",      label:"SD Ticket #",                    aliases:["sd ticket","ticket","sd #"],                   multi:false },
  { id:"adoCard",       label:"ADO Card #",                     aliases:["ado card","ado #","ado"],                      multi:false },
  { id:"fixVersion",    label:"Fix Version",                    aliases:["fix version","version","release"],             multi:false },
  { id:"sprintName",    label:"Sprint Name",                    aliases:["sprint name","sprint"],                        multi:false },
  { id:"createdDate",   label:"Created Date",                   aliases:["created date","created","date created"],       multi:false },
  { id:"targetDate",    label:"Due Date",                       aliases:["due date","target date","deadline"],           multi:false },
  { id:"reqByDate",     label:"Requested By Date",              aliases:["requested by","req by","requested delivery"],  multi:false },
  { id:"submitter",     label:"Submitter Name",                 aliases:["submitter","submitted by","submitter name"],   multi:false },
  { id:"sponsor",       label:"Sponsors",                       aliases:["sponsor","sponsors"],                          multi:false },
  { id:"ba",            label:"Business Analyst",               aliases:["business analyst","ba","analyst"],             multi:false },
  { id:"developer",     label:"Developer",                      aliases:["developer","dev"],                             multi:false },
  { id:"qa",            label:"QA Analyst",                     aliases:["qa analyst","qa","quality"],                   multi:false },
  { id:"uat",           label:"UAT Analyst / Sign-Off",         aliases:["uat analyst","uat","sign off","sign-off"],     multi:false },
  { id:"moscow",        label:"MoSCoW Score",                   aliases:["moscow","must have","should have","could have","won't have","mosocw"], multi:false },
  { id:"impactScore",   label:"Impact Score",                   aliases:["impact score","impact"],                       multi:false },
  { id:"impactJust",    label:"Impact Score Justification",     aliases:["impact score justification","justification"],  multi:true  },
  { id:"confidence",    label:"Confidence %",                   aliases:["confidence","confidence %"],                   multi:false },
  { id:"storyDev",      label:"Story Points (Dev)",             aliases:["story points dev","story points (dev)","dev points"], multi:false },
  { id:"storyQA",       label:"Story Points (QA)",              aliases:["story points qa","story points (qa)","qa points"], multi:false },
  { id:"severity",      label:"Severity",                       aliases:["severity"],                                    multi:true  },
  { id:"strategy",      label:"Existing Strategy",              aliases:["existing strategy","strategy","part of an existing strategy"], multi:false },
  { id:"objective",     label:"Business Objective",             aliases:["business objective","objective","what business objective"], multi:true  },
  { id:"problem",       label:"Problem to Solve",               aliases:["problem","what problem","problem to solve","what problem are we trying"], multi:true  },
  { id:"audience",      label:"Who We're Solving For",          aliases:["who are we solving","who we're solving","audience","solving for"], multi:false },
  { id:"userCount",     label:"Users / Groups Affected",        aliases:["how many","user count","users affected","number of users"], multi:false },
  { id:"vision",        label:"Future State Vision",            aliases:["future state","vision","future state vision"],  multi:true  },
  { id:"successMetrics",label:"How Impact Will Be Measured",    aliases:["impact measured","success measured","how will impact","success metrics"], multi:true  },
  { id:"roiValue",      label:"Targeted Value / ROI",           aliases:["targeted value","roi","cost savings","value"],  multi:false },
  { id:"dependencies",  label:"Dependencies",                   aliases:["dependencies","depends on"],                   multi:false },
];

// ═══════════════════════════════════════════════════════
// PASTE PARSER — parses TSV copied from Smartsheet grid
// ═══════════════════════════════════════════════════════
function parsePastedData(raw) {
  const lines = raw.trim().split(/\r?\n/);
  if (lines.length < 2) return null;

  // Parse TSV headers and single data row
  const parseRow = (line) => line.split('\t').map(c => c.trim());
  const headers = parseRow(lines[0]);
  const dataRow  = parseRow(lines[lines.length > 1 ? 1 : 0]);

  const result = {};
  headers.forEach((h, i) => {
    const val = dataRow[i] || "";
    if (!h || !val) return;
    const hNorm = h.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim();

    // Match against canvas field aliases
    for (const field of CANVAS_FIELDS) {
      for (const alias of field.aliases) {
        const aliasNorm = alias.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim();
        if (hNorm.includes(aliasNorm) || aliasNorm.includes(hNorm.slice(0, 6))) {
          if (!result[field.id]) result[field.id] = val;
          break;
        }
      }
    }
  });
  return result;
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let state = {
  step: 1,
  inputMode: "paste",   // "paste" | "api"
  pasteRaw: "",
  parseError: "",
  ssToken: "", ssSheetId: "",
  ssSheet: null, ssColMap: {},
  loading: false, apiError: "",
  canvas: {},
  iv: initInterview(),
  tab: "stakeholders",
  spToken: "", spUrl: "",
  uploading: false, uploadMsg: "",
  saved: false,
};

function initInterview() {
  return {
    stakeholders: [{ name:"", role:"", type:"Sponsor", involvement:"Approver", commsNeeds:"Executive summary updates" }],
    requirements: [emptyReq(1), emptyReq(2)],
    useCases:     [emptyUC(1)],
    nfrs:         [emptyNFR(1)],
    devHandover:  { systemComponents:"", dataModel:"", apiChanges:"", integrations:"", envReqs:"", deployNotes:"", rollback:"" },
    testCases:    [emptyTC(1), emptyTC(2)],
    uatCases:     [emptyUAT(1)],
    inScope:      [""],
    outScope:     [""],
    docOwner:     "",
    businessUnit: "",
    version:      "1.0 DRAFT",
  };
}
function emptyReq(n) { return { id:`REQ-${String(n).padStart(3,"0")}`, title:"", priority:"Critical", type:"Functional", description:"", actors:"", preconditions:"", postconditions:"", ac:"" }; }
function emptyUC(n)  { return { id:`UC-${String(n).padStart(3,"0")}`, title:"", actor:"", trigger:"", mainFlow:"", altFlows:"", post:"", linkedReqs:"" }; }
function emptyTC(n)  { return { id:`TC-${String(n).padStart(3,"0")}`, scenario:"", steps:"", expected:"", priority:"High" }; }
function emptyUAT(n) { return { id:`UAT-${String(n).padStart(3,"0")}`, scenario:"", userStory:"", given:"", when:"", then:"", acceptance:"" }; }
function emptyNFR(n) { return { id:`NFR-${String(n).padStart(3,"0")}`, category:"Performance", requirement:"", priority:"High" }; }

// ═══════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════
async function loadFromStorage() {
  try {
    const s = await window.storage.get("req-tool-v2");
    if (s) {
      const d = JSON.parse(s.value);
      if (d.canvas) state.canvas = d.canvas;
      if (d.iv) state.iv = { ...initInterview(), ...d.iv };
      if (d.step && d.step > 1) state.step = d.step;
    }
  } catch {}
}
async function saveToStorage() {
  try {
    await window.storage.set("req-tool-v2", JSON.stringify({ canvas: state.canvas, iv: state.iv, step: state.step }));
    state.saved = true;
    render();
    setTimeout(() => { state.saved = false; render(); }, 1600);
  } catch {}
}
let autoSaveTimer = null;
function scheduleAutoSave() { clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(saveToStorage, 900); }

// ═══════════════════════════════════════════════════════
// SMARTSHEET API
// ═══════════════════════════════════════════════════════
async function connectSS() {
  state.loading = true; state.apiError = ""; render();
  try {
    const res = await fetch(`https://api.smartsheet.com/2.0/sheets/${state.ssSheetId}`, {
      headers: { Authorization: `Bearer ${state.ssToken}`, Accept: "application/json" }
    });
    if (!res.ok) throw new Error(`Smartsheet API: ${res.status} ${res.statusText}`);
    const data = await res.json();
    state.ssSheet = data;
    const map = {};
    CANVAS_FIELDS.forEach(f => {
      const col = data.columns?.find(c => {
        const t = c.title?.toLowerCase().replace(/[^a-z]/g,"");
        return f.aliases.some(a => t?.includes(a.replace(/[^a-z]/g,"").slice(0,7)));
      });
      if (col) map[f.id] = col.id;
    });
    state.ssColMap = map;
    state.step = 2;
  } catch(e) { state.apiError = e.message; }
  state.loading = false; render();
}

function selectSSRow(row) {
  const extracted = {};
  CANVAS_FIELDS.forEach(f => {
    const colId = state.ssColMap[f.id];
    if (colId) {
      const cell = row.cells?.find(c => c.columnId === colId);
      if (cell?.value != null) extracted[f.id] = String(cell.value);
    }
  });
  state.canvas = extracted;
  state.step = 3;
  render();
}

// ═══════════════════════════════════════════════════════
// DOCUMENT GENERATOR
// ═══════════════════════════════════════════════════════
function buildDoc(canvas, iv) {
  const now = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const cv = (v, fb="[ to be completed ]") => v || `<span style="color:#B0B8C4;font-style:italic;">${fb}</span>`;
  const nl = (s) => (s||"").replace(/\n/g,"<br>");

  const hdr = (txt, bg=C.navy) =>
    `<td style="background:${bg};color:#fff;font-weight:bold;font-size:10.5pt;padding:5pt 8pt;border:1pt solid #C8D0DA;">${txt}</td>`;
  const cell = (txt, bg="#FFFFFF") =>
    `<td style="background:${bg};font-size:10.5pt;padding:5pt 8pt;border:1pt solid #C8D0DA;vertical-align:top;">${txt}</td>`;

  const banner = (num, title, color, pb=true) => `
    ${pb?`<p style="page-break-before:always;margin:0;"> </p>`:""}
    <table style="width:100%;border-collapse:collapse;margin:14pt 0 6pt;">
      <tr>
        <td style="background:${color};color:#fff;font-weight:bold;font-size:13pt;padding:8pt 14pt;width:36pt;text-align:center;border:none;">${num}</td>
        <td style="background:#EEF2F6;color:${color};font-weight:bold;font-size:11pt;padding:8pt 14pt;letter-spacing:1.5px;border:none;text-transform:uppercase;">${title}</td>
      </tr>
    </table>`;

  const h2 = (t) => `<h2 style="font-size:13pt;color:${C.slate};font-weight:bold;margin:10pt 0 4pt;font-family:Calibri;">${t}</h2>`;
  const src = (t) => `<p style="font-size:9.5pt;color:${C.mid};font-style:italic;margin:0 0 5pt;">↳ Canvas: ${t}</p>`;

  const reqBlock = (r) => `
    <table style="width:100%;border-collapse:collapse;margin:8pt 0;">
      <tr><td colspan="2" style="background:${C.navy};color:#fff;font-weight:bold;font-size:10.5pt;padding:6pt 10pt;">Requirement ${r.id}</td></tr>
      <tr>${hdr("Title")}${cell(cv(r.title),"#F7F9FC")}</tr>
      <tr>${hdr("Priority",C.slate)}${cell(`<span style="font-weight:bold;color:${r.priority==="Critical"?C.crimson:r.priority==="High"?C.amber:C.teal}">${r.priority}</span>`)}</tr>
      <tr>${hdr("Type")}${cell(cv(r.type),"#F7F9FC")}</tr>
      <tr>${hdr("Description",C.slate)}${cell(nl(cv(r.description)))}</tr>
      <tr>${hdr("Primary Actors")}${cell(cv(r.actors),"#F7F9FC")}</tr>
      <tr>${hdr("Preconditions",C.slate)}${cell(nl(cv(r.preconditions)))}</tr>
      <tr>${hdr("Postconditions")}${cell(nl(cv(r.postconditions)),"#F7F9FC")}</tr>
      <tr>${hdr("Acceptance Criteria",C.slate)}${cell(nl(cv(r.ac)))}</tr>
    </table>`;

  const ucBlock = (u) => `
    <table style="width:100%;border-collapse:collapse;margin:8pt 0;">
      <tr><td colspan="2" style="background:${C.teal};color:#fff;font-weight:bold;font-size:10.5pt;padding:6pt 10pt;">${u.id}: ${cv(u.title,"[ Use Case Title ]")}</td></tr>
      ${[["Actor",u.actor],["Trigger",u.trigger],["Main Flow",u.mainFlow],["Alternate Flows",u.altFlows],["Postconditions",u.post],["Linked Requirements",u.linkedReqs]]

// DOWNLOAD
// ═══════════════════════════════════════════════════════
function downloadDoc() {
  const html = buildDoc(state.canvas, state.iv);
  const fname = `${(state.canvas.title||"Requirements_Document").replace(/[^a-zA-Z0-9]+/g,"_")}_BRD.doc`;
  const blob = new Blob([html], { type:"application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// SHAREPOINT UPLOAD
// ═══════════════════════════════════════════════════════
async function uploadSP() {
  state.uploading = true; state.uploadMsg = ""; render();
  try {
    const html = buildDoc(state.canvas, state.iv);
    const fname = `${(state.canvas.title||"Requirements_Document").replace(/[^a-zA-Z0-9]+/g,"_")}_BRD.doc`;
    const match = state.spUrl.match(/^(https:\/\/[^/]+)(\/sites\/[^/]+)(\/[^?]*)?/);
    if (!match) throw new Error("Invalid SharePoint URL format");
    const [, host, sitePath, libPath] = match;
    const siteRes = await fetch(`https://graph.microsoft.com/v1.0/sites/${host.replace("https://","")}:${sitePath}`, { headers:{Authorization:`Bearer ${state.spToken}`} });
    if (!siteRes.ok) throw new Error(`Could not locate SharePoint site: ${siteRes.status}`);
    const site = await siteRes.json();
    const drivesRes = await fetch(`https://graph.microsoft.com/v1.0/sites/${site.id}/drives`, { headers:{Authorization:`Bearer ${state.spToken}`} });
    const drivesData = await drivesRes.json();
    const drive = drivesData.value?.[0];
    if (!drive) throw new Error("No document library found");
    const folderPath = (libPath||"/Shared Documents").replace(/^\/+/,"");
    const blob = new Blob([html], {type:"application/msword"});
    const uploadRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${drive.id}/root:/${folderPath}/${fname}:/content`, {
      method:"PUT", headers:{Authorization:`Bearer ${state.spToken}`,"Content-Type":"application/msword"}, body:blob
    });
    if (!uploadRes.ok) throw new Error(`Upload failed: ${uploadRes.status}`);
    const result = await uploadRes.json();
    state.uploadMsg = `ok:✓ Uploaded: ${result.name||fname}`;
  } catch(e) { state.uploadMsg = `err:✗ ${e.message}`; }
  state.uploading = false; render();
}

// RENDER
// ═══════════════════════════════════════════════════════
function set(key, val, sub=null) {
  if (sub) state[key] = { ...state[key], [sub]: val };
  else state[key] = val;
  scheduleAutoSave();
  render();
}
function setCanvas(id, val) { state.canvas = { ...state.canvas, [id]: val }; scheduleAutoSave(); render(); }
function setIv(key, val) { state.iv = { ...state.iv, [key]: val }; scheduleAutoSave(); render(); }

function inp(id, placeholder, multiline=false, rows=2) {
  const val = state.canvas[id] || "";
  if (multiline) {
    return `<textarea rows="${rows}" class="paste-area" style="font-family:inherit;font-size:13px;min-height:auto;" 
      oninput="setCanvas('${id}',this.value)" placeholder="${placeholder}">${escH(val)}</textarea>`;
  }
  return `<input value="${escH(val)}" oninput="setCanvas('${id}',this.value)" placeholder="${placeholder}">`;
}
function ivInp(key, subkey, placeholder, multiline=false, rows=2) {
  const val = (state.iv[key]||{})[subkey] || "";
  if (multiline) return `<textarea rows="${rows}" style="font-family:inherit;font-size:13px;width:100%;resize:vertical;" oninput="updateIvSub('${key}','${subkey}',this.value)" placeholder="${placeholder}">${escH(val)}</textarea>`;
  return `<input value="${escH(val)}" oninput="updateIvSub('${key}','${subkey}',this.value)" placeholder="${placeholder}">`;
}
function escH(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

window.updateIvSub = (key, subkey, val) => {
  state.iv = { ...state.iv, [key]: { ...state.iv[key], [subkey]: val } };
  scheduleAutoSave(); render();
};
window.updateIvArr = (key, idx, subkey, val) => {
  const arr = [...(state.iv[key]||[])];
  arr[idx] = { ...arr[idx], [subkey]: val };
  state.iv = { ...state.iv, [key]: arr };
  scheduleAutoSave(); render();
};
window.updateScope = (key, idx, val) => {
  const arr = [...(state.iv[key]||[])];
  arr[idx] = val;
  state.iv = { ...state.iv, [key]: arr };
  scheduleAutoSave(); render();
};
window.removeArrItem = (key, idx) => {
  state.iv = { ...state.iv, [key]: state.iv[key].filter((_,i)=>i!==idx) };
  scheduleAutoSave(); render();
};
window.addArrItem = (key, factory) => {
  state.iv = { ...state.iv, [key]: [...state.iv[key], factory(state.iv[key].length+1)] };
  scheduleAutoSave(); render();
};
window.setCanvas = setCanvas;
window.setIv = setIv;

function renderProgress() {
  const steps = ["Intake","Canvas Review","BA Interview","Generate"];
  const s = state.step;
  return `<div class="progress-bar">${steps.map((lbl,i)=>{
    const n=i+1, done=n<s, active=n===s;
    const dotClass = done?"done":active?"active":"pending";
    const lblClass = done?"done":active?"active":"pending";
    const line = i<steps.length-1 ? `<div class="step-line ${done||active?"done":""}"></div>` : "";
    return `<div class="step-item">
      <div class="step-dot ${dotClass}" ${done?`onclick="state.step=${n};render()"`:""}>${done?"✓":n}</div>
      <span class="step-label ${lblClass}">${lbl}</span>
      ${line}
    </div>`;
  }).join("")}</div>`;
}

window.selectSSRow_render = (rowId) => {

window.handleParse = () => {
  if (!state.pasteRaw.trim()) { state.parseError = "Please paste at least a header row and one data row."; render(); return; }
  const result = parsePastedData(state.pasteRaw);
  if (!result || Object.keys(result).length === 0) {
    state.parseError = "Could not match any columns. Make sure you've copied both the header row and data row from Smartsheet.";
    render(); return;
  }
  state.canvas = { ...state.canvas, ...result };
  state.parseError = "";
  state.step = 2;
  render();
};

        <div style="display:flex;gap:8px;align-items:center;">
          <select style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:2px 6px;font-size:12px;" onchange="updateIvArr('testCases',${i},'priority',this.value)">
            ${["Critical","High","Medium","Low"].map(p=>`<option ${t.priority===p?"selected":""}>${p}</option>`).join("")}
          </select>
          ${i>0?`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:11px;padding:3px 10px;" onclick="removeArrItem('testCases',${i})">✕</button>`:""}
        </div>
      </div>
      <div class="subcard-body">
        ${[["Test Scenario","scenario",false,1,"e.g. User submits enrollment during open window"],["Test Steps (numbered)","steps",true,4,"1. Navigate to...\n2. Select...\n3. Confirm..."],["Expected Result","expected",true,3,"System should..."]].map(([lbl,key,ml,rows,ph])=>`
          <div class="field-group"><div class="field-label">${lbl}</div>
            ${ml?`<textarea rows="${rows}" style="width:100%;resize:vertical;font-family:inherit;font-size:13px;" oninput="updateIvArr('testCases',${i},'${key}',this.value)" placeholder="${ph}">${escH(t[key]||"")}</textarea>`
              :`<input value="${escH(t[key]||"")}" oninput="updateIvArr('testCases',${i},'${key}',this.value)" placeholder="${ph}">`}
          </div>`).join("")}
      </div>
    </div>`).join("")}
    <button class="btn btn-ghost" onclick="addArrItem('testCases',(n)=>({id:'TC-'+String(n).padStart(3,'0'),scenario:'',steps:'',expected:'',priority:'High'}))">+ Add Test Case</button>
  </div>`;

  if (tab==="uatCases") return `<div>
    <div class="callout callout-success">UAT cases are for <strong>business users</strong> — plain language, Given/When/Then format. The business team uses these to confirm the solution meets their needs.</div>
    ${iv.uatCases.map((u,i)=>`<div class="subcard" style="margin-bottom:12px;">
      <div class="subcard-header" style="background:var(--teal);color:#fff;">
        <span>${u.id}</span>
        ${i>0?`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:11px;padding:3px 10px;" onclick="removeArrItem('uatCases',${i})">✕ Remove</button>`:""}
      </div>
      <div class="subcard-body">
        ${[["Business Scenario","scenario",false,1,"Describe the business scenario being tested"],["User Story","userStory",false,1,"As a [role], I want to [action] so that [benefit]"],["Given (starting state)","given",true,2,"Given that the user is..."],["When (action taken)","when",true,2,"When the user..."],["Then (expected outcome)","then",true,2,"Then the system should..."],["Acceptance Criteria","acceptance",true,2,"The business will accept this if..."]].map(([lbl,key,ml,rows,ph])=>`
          <div class="field-group"><div class="field-label">${lbl}</div>
            ${ml?`<textarea rows="${rows}" style="width:100%;resize:vertical;font-family:inherit;font-size:13px;" oninput="updateIvArr('uatCases',${i},'${key}',this.value)" placeholder="${ph}">${escH(u[key]||"")}</textarea>`
              :`<input value="${escH(u[key]||"")}" oninput="updateIvArr('uatCases',${i},'${key}',this.value)" placeholder="${ph}">`}
          </div>`).join("")}
      </div>
    </div>`).join("")}
    <button class="btn btn-ghost" onclick="addArrItem('uatCases',(n)=>({id:'UAT-'+String(n).padStart(3,'0'),scenario:'',userStory:'',given:'',when:'',then:'',acceptance:''}))">+ Add UAT Case</button>
  </div>`;

  return "";
}

function renderStep4() {
  const { canvas, iv } = state;
  const canvasCount = Object.keys(canvas).filter(k=>canvas[k]).length;
  const uploadOk = state.uploadMsg.startsWith("ok:");
  const uploadErr = state.uploadMsg.startsWith("err:");

  return `<div>
    <div class="card">
      <div class="section-label">GENERATE & EXPORT</div>
      <div class="callout callout-success">
        <strong>Ready to generate.</strong> Your document includes ${iv.requirements.length} requirement(s), ${iv.useCases.length} use case(s), ${iv.testCases.length} test case(s), and ${iv.uatCases.length} UAT case(s).
      </div>
      <div class="stats-grid">
        ${[["Canvas Fields",canvasCount,"var(--accent)"],["Requirements",iv.requirements.length,"var(--navy)"],["Test Cases",iv.testCases.length,"var(--amber)"],["UAT Cases",iv.uatCases.length,"var(--teal)"]].map(([l,v,c])=>`
          <div class="stat-card" style="border-top-color:${c};">
            <div class="stat-num" style="color:${c};">${v}</div>
            <div class="stat-lbl">${l}</div>
          </div>`).join("")}
      </div>
      <button class="btn btn-primary" onclick="downloadDoc()" style="font-size:15px;padding:12px 32px;">
        ⬇ Download Requirements Document (.doc)
      </button>
      <p style="font-size:12px;color:var(--muted);margin-top:8px;">Opens in Microsoft Word. All 14 sections included. Calibri 11pt · professional formatting.</p>
    </div>

    <div class="card">
      <div class="section-label">UPLOAD TO SHAREPOINT</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Upload directly to a SharePoint document library using a Microsoft Graph API token.</p>
      <div class="callout callout-info">
        <strong>To get a Graph token:</strong> Visit developer.microsoft.com/graph/graph-explorer, sign in with your Microsoft account, and copy the access token from the Access Token tab.
      </div>
      <div class="grid-2">
        <div class="field-group"><div class="field-label">Microsoft Graph Access Token</div>
          <input type="password" value="${escH(state.spToken)}" oninput="state.spToken=this.value" placeholder="eyJ0eXAi..."></div>
        <div class="field-group"><div class="field-label">SharePoint Library URL</div>
          <input value="${escH(state.spUrl)}" oninput="state.spUrl=this.value" placeholder="https://org.sharepoint.com/sites/Site/Shared Documents"></div>
      </div>
      <button class="btn btn-accent" onclick="uploadSP()" ${(!state.spToken||!state.spUrl||state.uploading)?"disabled":""} style="margin-top:4px;">
        ${state.uploading?"Uploading…":"⬆ Upload to SharePoint"}
      </button>
      ${state.uploadMsg ? `<div class="upload-msg ${uploadOk?"upload-ok":"upload-err"}">${state.uploadMsg.slice(4)}</div>` : ""}
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" onclick="state.step=3;render()">← Back to Interview</button>
      <button class="btn" style="background:transparent;border:1.5px solid var(--crimson);color:var(--crimson);" 
        onclick="if(confirm('Start a new document? Current progress will be cleared.')){window.storage.delete('req-tool-v2');state={...state,step:1,canvas:{},iv:initInterview(),pasteRaw:'',inputMode:'paste'};render();}">
        Start New Document
      </button>
    </div>
  </div>`;
}

function render() {
  const { step, saved } = state;
  document.getElementById("app").innerHTML = `
    <div class="shell">
      <div class="topbar">
        <div class="topbar-left">
          <span class="topbar-brand">Requirements Document Tool</span>
          <span class="topbar-sub">Smartsheet Canvas → BRD</span>
        </div>
        <div class="topbar-right">
          <span class="save-badge ${saved?"show":""}">✓ Saved</span>
        </div>
      </div>
      ${renderProgress()}
      <div class="main">
        ${step===1 ? renderStep1() : step===2 ? renderStep2() : step===3 ? renderStep3() : renderStep4()}
      </div>
    </div>`;
}

// ── INIT ──
(async () => {
  await loadFromStorage();
  render();
})();
</script>
</body>
</html>
