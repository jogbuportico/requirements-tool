<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portico | BRD Tool v2.0</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F1C400;--gray:#54585A;--blue:#009CDE;--orange:#D86018;
  --green:#A2AD00;--red:#C5003E;--dgray:#3A3A3A;--lgray:#F4F4F4;
  --mgray:#D0D7DE;--white:#FFFFFF;
  --font:'Calibri',Georgia,serif;
  --radius:6px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body{font-family:var(--font);font-size:14px;color:var(--dgray);background:#ECEEF1;min-height:100vh;display:flex;flex-direction:column}

/* ── Top Bar ──────────────────────────────────────────────────────────── */
#topbar{background:var(--gray);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#topbar .brand{display:flex;align-items:center;gap:12px}
#topbar .brand span:first-child{color:var(--gold);font-size:18px;font-weight:800;letter-spacing:3px}
#topbar .brand span:last-child{color:#aaa;font-size:12px}
#topbar .actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--gray)}
.btn-gold:hover{background:#d4ab00}
.btn-ghost{background:transparent;color:#ccc;border:1px solid #555}
.btn-ghost:hover{border-color:#999;color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#0081b8}
.btn-gray{background:var(--gray);color:#fff;border:1px solid #6a6e70}
.btn-gray:hover{background:#444}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
#api-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;padding:5px 10px;border-radius:var(--radius);border:1px solid #555;color:#ccc;transition:all .15s}
#api-badge:hover{border-color:#999;color:#fff}
#api-badge.has-key{border-color:var(--green);color:var(--green)}

/* ── Nav Tabs ─────────────────────────────────────────────────────────── */
#nav{background:#fff;border-bottom:2px solid var(--mgray);display:flex;align-items:stretch;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-tab{padding:12px 20px;font-size:12px;font-weight:600;color:#888;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px;background:none;border-left:none;border-right:none;border-top:none;font-family:var(--font)}
.nav-tab:hover{color:var(--gray);background:#fafafa}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.nav-tab .tab-num{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--mgray);color:var(--gray)}
.nav-tab.active .tab-num{background:var(--blue);color:#fff}
.nav-tab.done .tab-num{background:var(--green);color:#fff}

/* ── Layout ───────────────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:380px 1fr;flex:1;min-height:0;height:calc(100vh - 52px - 48px)}
#left{background:#fff;overflow-y:auto;border-right:1px solid var(--mgray);display:flex;flex-direction:column}
#left-body{flex:1;padding:20px}
#left-actions{padding:12px 20px;border-top:1px solid var(--mgray);background:#fafafa;display:flex;gap:8px;flex-wrap:wrap}
#right{overflow-y:auto;padding:24px;background:#ECEEF1}

/* ── Form Elements ────────────────────────────────────────────────────── */
.fsec{background:#fff;border:1px solid var(--mgray);border-radius:8px;padding:16px;margin-bottom:14px;border-top:3px solid var(--blue)}
.fsec-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--gray);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--gray);margin-bottom:4px;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid var(--mgray);border-radius:var(--radius);padding:7px 10px;font-family:var(--font);font-size:13px;color:var(--dgray);background:#fff;outline:none;transition:border .15s;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue)}
.fg textarea{min-height:64px;line-height:1.5}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg-note{font-size:11px;color:#888;margin-top:3px;font-style:italic}

.list-item{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.list-item input{flex:1}
.del-btn{background:none;border:1px solid var(--red);border-radius:4px;color:var(--red);cursor:pointer;padding:4px 8px;font-size:11px;flex-shrink:0;font-family:var(--font);margin-top:1px}
.del-btn:hover{background:var(--red);color:#fff}
.add-btn{background:none;border:1.5px dashed var(--blue);border-radius:var(--radius);color:var(--blue);cursor:pointer;padding:5px 14px;font-size:11px;font-weight:600;font-family:var(--font);transition:all .15s}
.add-btn:hover{background:var(--blue);color:#fff}

.req-card{border:1px solid var(--mgray);border-radius:8px;margin-bottom:12px;overflow:hidden}
.req-card-hdr{background:var(--gray);color:#fff;padding:8px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.req-card-body{padding:12px;background:#fafafa}
.req-card-body .fg:last-child{margin-bottom:0}

/* ── Paste zone ───────────────────────────────────────────────────────── */
.paste-zone{border:2px dashed var(--mgray);border-radius:8px;padding:12px;background:var(--lgray);transition:border .2s}
.paste-zone:focus-within{border-color:var(--blue);background:#f0f8ff}
.paste-zone textarea{border:none!important;background:transparent!important;padding:4px!important;font-size:12px!important;min-height:80px}

/* ── Preview ──────────────────────────────────────────────────────────── */
#preview-wrap{background:#fff;border-radius:10px;box-shadow:var(--shadow);min-height:600px;overflow:hidden}
.brd-cover{background:var(--gray);padding:36px 40px;color:#fff;position:relative}
.brd-cover::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--gold)}
.brd-cover h1{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.brd-cover h2{font-size:13px;color:var(--gold);margin-bottom:16px;font-weight:400}
.brd-cover-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:#bbb;margin-top:12px}
.brd-cover-meta span{display:flex;gap:4px}<br>.brd-cover-meta strong{color:#ddd}
.brd-body{padding:24px 32px}
.brd-sec{margin-bottom:24px}
.brd-sec-hdr{display:flex;align-items:stretch;margin-bottom:10px;gap:0}
.brd-sec-num{background:var(--gray);color:#fff;font-weight:800;font-size:14px;width:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:3px 0 0 3px}
.brd-sec-title{background:var(--lgray);color:var(--gray);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;flex:1;display:flex;align-items:center;border-radius:0 3px 3px 0}
.brd-sub{font-size:12px;font-weight:700;color:var(--blue);margin:10px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--mgray)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.tbl th{background:var(--gray);color:#fff;padding:6px 10px;text-align:left;font-size:11px;font-weight:700}
.tbl td{padding:5px 10px;border:1px solid var(--mgray);vertical-align:top;line-height:1.5}
.tbl tr:nth-child(even) td{background:#fafafa}
.tbl .lbl{background:#f0f4f8;font-weight:700;font-size:11px;color:var(--gray);width:28%;white-space:nowrap}
.empty{color:#bbb;font-style:italic;font-size:11px}
.brd-bullets{margin:4px 0 4px 16px;font-size:12px;line-height:1.8}
.req-blk{border:1px solid var(--mgray);border-radius:6px;margin-bottom:12px;overflow:hidden}
.req-blk-hdr{background:var(--gray);color:#fff;padding:7px 12px;font-size:12px;font-weight:700}
.nfr-blk{background:#f7f9fb;border-left:3px solid var(--blue);padding:8px 12px;margin-bottom:6px;font-size:12px}
.risk-blk{background:#fff8f0;border-left:3px solid var(--orange);padding:8px 12px;margin-bottom:6px;font-size:12px}
.uat-blk{border:1px solid var(--mgray);border-radius:6px;margin-bottom:12px;overflow:hidden}
.uat-blk-hdr{background:var(--green);color:#fff;padding:7px 12px;font-size:12px;font-weight:700}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.meta-item{font-size:11px;display:flex;gap:4px}<br>.meta-item strong{color:var(--gray)}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase}
.tag-must{background:#fde8ee;color:var(--red)}
.tag-should{background:#fff3cd;color:#856404}
.tag-could{background:#e8f5e9;color:var(--green)}

/* ── Saved panel ──────────────────────────────────────────────────────── */
.saved-card{border:1px solid var(--mgray);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;background:#fff;gap:8px}
.saved-card-title{font-size:13px;font-weight:700;color:var(--dgray)}
.saved-card-meta{font-size:11px;color:#888;margin-top:2px}
.saved-card-actions{display:flex;gap:6px;flex-shrink:0}

/* ── Toast ────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--dgray);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;z-index:9999}
#toast.show{transform:translateY(0);opacity:1}

/* ── Spinner ──────────────────────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

/* ── AI Expanding ─────────────────────────────────────────────────────── */
.ai-expanding{background:linear-gradient(135deg,#e8f4fd,#f0f8ff);border:1px solid var(--blue);border-radius:8px;padding:14px;margin-bottom:12px;font-size:12px}
.ai-expanding .ai-label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ai-field{margin-bottom:10px}
.ai-field label{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:3px}
.ai-field textarea{width:100%;border:1px solid rgba(0,156,222,.3);border-radius:4px;padding:6px 8px;font-family:var(--font);font-size:12px;background:rgba(255,255,255,.7);color:var(--dgray);resize:vertical;min-height:52px;outline:none}
.ai-field textarea:focus{border-color:var(--blue);background:#fff}

/* ── Responsive helpers ───────────────────────────────────────────────── */
@media(max-width:900px){#app{grid-template-columns:1fr};#right{display:none}}
</style>
</head>
<body>

<!-- ── TOP BAR ─────────────────────────────────────────────────────────── -->
<div id="topbar">
  <div class="brand">
    <span>PORTICO</span>
    <span>Business Requirements Document Tool v2.0</span>
  </div>
  <div class="actions">
    <div id="api-badge" onclick="setApiKey()" title="Set Anthropic API key for AI extraction">
      🔑 <span id="api-label">Set API Key</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="newBRD()">+ New</button>
    <button class="btn btn-ghost btn-sm" onclick="saveBRD()">💾 Save</button>
    <button class="btn btn-gold btn-sm" onclick="downloadBRD()">⬇ Download BRD</button>
  </div>
</div>

<!-- ── NAV ────────────────────────────────────────────────────────────── -->
<div id="nav">
  <button class="nav-tab" onclick="goto(1)" id="tab1"><span class="tab-num">1</span> Canvas Data</button>
  <button class="nav-tab" onclick="goto(2)" id="tab2"><span class="tab-num">2</span> Scope &amp; Stakeholders</button>
  <button class="nav-tab" onclick="goto(3)" id="tab3"><span class="tab-num">3</span> Requirements</button>
  <button class="nav-tab" onclick="goto(4)" id="tab4"><span class="tab-num">4</span> Source Documents</button>
  <button class="nav-tab" onclick="goto(5)" id="tab5"><span class="tab-num">5</span> Saved BRDs</button>
</div>

<!-- ── APP ────────────────────────────────────────────────────────────── -->
<div id="app">
  <div id="left">
    <div id="left-body"></div>
    <div id="left-actions"></div>
  </div>
  <div id="right">
    <div id="preview-wrap">
      <div id="preview"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const SAVED = 'portico-brd-v2';
const FIXED_BA_MANAGER = 'Charlie Nadeau';

// ─── STATE ────────────────────────────────────────────────────────────────────
let D = blankState();
let step = 1;

function blankState(){
  return {
    // Canvas-sourced fields
    title:'', sponsor:'', businessUnit:'', version:'1.0 DRAFT',
    targetDate:'', moscow:'Must Have', sdTicket:'', adoCard:'',
    submitter:'', initiative:'', domain:'', capability:'',
    impactOp:0, impactFin:0, impactSec:0, impactComp:0, impactRep:0,
    confidence:'', impactTotal:'', impactJustification:'',
    roiValue:'', budgetNeeded:'', severity:'',
    existingStrategy:'', objective:'', problem:'',
    audience:'', userCount:'', vision:'', successMetrics:'',
    dependencies:'', additionalDetails:'',
    // Team — BA Manager is fixed; all others from canvas or blank
    baManager: FIXED_BA_MANAGER,
    productOwner:'', ba:'', pm:'', productSpecialist:'',
    // Interview-time fields (left blank)
    developer:'', qaAnalyst:'', uatOwner:'',
    sprintName:'', fixVersion:'',
    // Document sections
    inScope:['',''], outScope:[''],
    constraints:[''],
    stakeholders:[{name:'',type:'Sponsor',involvement:'Approver',commsNeeds:''}],
    requirements:[{id:'BRD-001',title:'',priority:'High',description:'',businessValue:'',acceptanceCriteria:'',actors:'',stakeholder:'',preconditions:'',postconditions:'',context:[]}],
    nfrs:[{cat:'Availability',req:'',pri:'High'},{cat:'Security',req:'',pri:'High'},{cat:'Performance',req:'',pri:'Medium'}],
    risks:[{title:'',likelihood:'Medium',impact:'High',mitigation:''}],
    uatCases:[{scenario:'',given:'',when:'',then:''}],
    documents:[],
  };
}

// ─── STEP NAV ─────────────────────────────────────────────────────────────────
function goto(n){ step=n; render(); persist(); updateTabs(); }
function updateTabs(){
  for(let i=1;i<=5;i++){
    const t=document.getElementById('tab'+i);
    if(!t)continue;
    t.classList.toggle('active',i===step);
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const lb=document.getElementById('left-body');
  const la=document.getElementById('left-actions');
  lb.innerHTML=steps[step].form();
  la.innerHTML=steps[step].actions();
  renderPreview();
  updateTabs();
}
const x = v => String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rp = () => { persist(); renderPreview(); };

// ─── STEP 1: CANVAS DATA ──────────────────────────────────────────────────────
const steps = {
  1:{
    form(){
      const impactTotal = (D.impactOp||0)+(D.impactFin||0)+(D.impactSec||0)+(D.impactComp||0)+(D.impactRep||0);
      return `
      <div class="fsec">
        <div class="fsec-label">📥 Import from Smartsheet</div>
        <p style="font-size:11px;color:#666;margin-bottom:10px;line-height:1.5">Copy the header row + data row from your Opportunity Canvas in Smartsheet and paste below. With an API key set, Claude will extract all fields automatically.</p>
        <div class="paste-zone">
          <textarea id="ss-paste" rows="5" placeholder="Paste Smartsheet headers + data row here..."></textarea>
        </div>
        <div style="margin-top:8px">
          <button class="btn btn-blue" style="width:100%" onclick="extractSmartsheet()">⚡ Extract Fields Automatically</button>
        </div>
      </div>

      <div class="fsec">
        <div class="fsec-label">📋 Project Header</div>
        <div class="fg"><label>Opportunity / Project Title</label>
          <input value="${x(D.title)}" oninput="D.title=this.value;rp()"></div>
        <div class="fg-row">
          <div class="fg"><label>SD Ticket #</label>
            <input value="${x(D.sdTicket)}" oninput="D.sdTicket=this.value;rp()" placeholder="e.g. 28109"></div>
          <div class="fg"><label>ADO Card #</label>
            <input value="${x(D.adoCard)}" oninput="D.adoCard=this.value;rp()" placeholder="e.g. 54037"></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Target Date</label>
            <input value="${x(D.targetDate)}" oninput="D.targetDate=this.value;rp()"></div>
          <div class="fg"><label>MoSCoW</label>
            <select onchange="D.moscow=this.value;rp()">
              ${['Must Have','Should Have','Could Have',"Won't Have"].map(v=>`<option ${D.moscow===v?'selected':''}>${v}</option>`).join('')}
            </select></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Initiative</label>
            <input value="${x(D.initiative)}" oninput="D.initiative=this.value;rp()"></div>
          <div class="fg"><label>Business Unit / Domain</label>
            <input value="${x(D.businessUnit)}" oninput="D.businessUnit=this.value;rp()"></div>
        </div>
        <div class="fg"><label>Submitter</label>
          <input value="${x(D.submitter)}" oninput="D.submitter=this.value;rp()" placeholder="From Smartsheet entry"></div>
        <div class="fg"><label>Version</label>
          <input value="${x(D.version)}" oninput="D.version=this.value;rp()"></div>
      </div>

      <div class="fsec">
        <div class="fsec-label">👥 Team</div>
        <p style="font-size:11px;color:#888;margin-bottom:10px;line-height:1.5">Sponsor, Product Owner, BA, PM, and Product Specialist are populated from the canvas entry or filled during the interview. BA Manager is always Charlie Nadeau. Interview-time fields (Developer, QA, UAT) are left blank.</p>
        <div class="fg"><label>Sponsor(s)</label>
          <input value="${x(D.sponsor)}" oninput="D.sponsor=this.value;rp()" placeholder="From Smartsheet — who are the sponsors?"></div>
        <div class="fg"><label>Product Owner</label>
          <input value="${x(D.productOwner)}" oninput="D.productOwner=this.value;rp()" placeholder="From canvas or interview"></div>
        <div class="fg"><label>Business Analyst</label>
          <input value="${x(D.ba)}" oninput="D.ba=this.value;rp()" placeholder="From canvas or interview"></div>
        <div class="fg"><label>Business Analyst Manager</label>
          <input value="${x(FIXED_BA_MANAGER)}" disabled style="background:#f0f0f0;color:#888"></div>
        <div class="fg"><label>Project Manager</label>
          <input value="${x(D.pm)}" oninput="D.pm=this.value;rp()" placeholder="From canvas or interview"></div>
        <div class="fg"><label>Product Specialist</label>
          <input value="${x(D.productSpecialist)}" oninput="D.productSpecialist=this.value;rp()" placeholder="From canvas or interview"></div>
        <div class="fg-row">
          <div class="fg"><label>Developer</label>
            <input value="${x(D.developer)}" oninput="D.developer=this.value;rp()" placeholder="Fill during interview"></div>
          <div class="fg"><label>QA Analyst</label>
            <input value="${x(D.qaAnalyst)}" oninput="D.qaAnalyst=this.value;rp()" placeholder="Fill during interview"></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>UAT / Business Sign-Off</label>
            <input value="${x(D.uatOwner)}" oninput="D.uatOwner=this.value;rp()" placeholder="Fill during interview"></div>
          <div class="fg"><label>Sprint / Fix Version</label>
            <input value="${x(D.sprintName)}" oninput="D.sprintName=this.value;rp()" placeholder="Fill during planning"></div>
        </div>
      </div>

      <div class="fsec">
        <div class="fsec-label">🎯 Problem &amp; Objective</div>
        <div class="fg"><label>Is this part of an existing strategy?</label>
          <input value="${x(D.existingStrategy)}" oninput="D.existingStrategy=this.value;rp()" placeholder="e.g. Connected Execution, Connected Platforms"></div>
        <div class="fg"><label>What business objective does this align to?</label>
          <textarea oninput="D.objective=this.value;rp()">${x(D.objective)}</textarea></div>
        <div class="fg"><label>What problem are we trying to solve?</label>
          <textarea rows="4" oninput="D.problem=this.value;rp()">${x(D.problem)}</textarea></div>
        <div class="fg"><label>Who are we solving this for?</label>
          <textarea rows="2" oninput="D.audience=this.value;rp()">${x(D.audience)}</textarea></div>
        <div class="fg"><label>How many people / users are affected?</label>
          <textarea rows="2" oninput="D.userCount=this.value;rp()">${x(D.userCount)}</textarea></div>
        <div class="fg"><label>Future state vision</label>
          <textarea rows="3" oninput="D.vision=this.value;rp()">${x(D.vision)}</textarea></div>
      </div>

      <div class="fsec">
        <div class="fsec-label">📊 Scoring &amp; Value</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
          ${[['Operational','impactOp'],['Financial','impactFin'],['Security','impactSec'],['Compliance','impactComp'],['Reputational','impactRep']].map(([l,k])=>
            `<div class="fg"><label style="font-size:10px">${l}</label>
              <select onchange="D.${k}=+this.value;rp()">
                ${[0,25,50,75,100].map(v=>`<option ${D[k]===v?'selected':''}>${v}</option>`).join('')}
              </select></div>`).join('')}
          <div class="fg"><label style="font-size:10px">Confidence</label>
            <select onchange="D.confidence=this.value;rp()">
              ${['','20%','40%','50%','60%','80%','100%'].map(v=>`<option ${D.confidence===v?'selected':''}>${v||'—'}</option>`).join('')}
            </select></div>
        </div>
        <div style="background:var(--lgray);border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:10px">

  title:         ['opportunity title','title','project name','opportunity name','opp title','name of opportunity'],
  sponsor:       ['sponsor','sponsors','sponsored by','project sponsor','who are the sponsors'],

const QUESTION_PATTERNS = [
  /^what (is|are|business|does|problem|happens|will|the)/i,
  /^how (many|will|do we|is|can)/i,
  /^who (are|is|will|we)/i, /^when (does|is|will|should)/i,
  /^why (is|are|do|should)/i, /^describe /i, /^which /i,
  /^does this /i, /\?$/, /^is there /i, /^if not solved/i,
];
const isQ = v => QUESTION_PATTERNS.some(p => p.test((v||'').trim()));
const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();

function bestMatch(key){
  const nk = norm(key);
  if(nk.length < 2) return null;
  let bestF=null, bestS=28;
  for(const [field,aliases] of Object.entries(SYNONYMS)){
    for(const alias of aliases){
      const na = norm(alias);
      let score = 0;
      if(nk===na) score=100;
      else if(nk.includes(na)||na.includes(nk)) score=80;
      else {
        const hw=new Set(nk.split(/\s+/)), aw=na.split(/\s+/);
        score = aw.filter(w=>w.length>3&&hw.has(w)).length*25;
      }
      if(score>bestS){bestS=score;bestF=field;}
    }
  }
  return bestF;
}

function cleanVal(v){
  v=(v||'').trim();
  if(!v||v==='-'||v.toLowerCase()==='null'||v.toLowerCase()==='n/a') return '';
  if(isQ(v)) return '';
  if(/^\d{1,4}$/.test(v)&&v.length<3) return ''; // bare row numbers only
  return v;
}

function applyToD(field, val){
  if(!field || !val) return false;
  // Numeric impact fields
  if(['impactOp','impactFin','impactSec','impactComp','impactRep'].includes(field)){
    const n = parseInt(val);
    if(!isNaN(n)) { D[field]=n; return true; }
  }
  // Don't overwrite baManager
  if(field==='baManager') return false;
  // MoSCoW normalize
  if(field==='moscow'){
    const mv = val.toLowerCase();
    if(mv.includes('must')) D.moscow='Must Have';
    else if(mv.includes('should')) D.moscow='Should Have';
    else if(mv.includes('could')) D.moscow='Could Have';
    else if(mv.includes("won't")||mv.includes('wont')) D.moscow="Won't Have";
    else D.moscow=val;
    return true;
  }
  if(field in D){ D[field]=val; return true; }
  return false;
}

function extractLocally(raw){
  const lines = raw.split('\n').map(l=>l.trimEnd()).filter(l=>l.trim());
  let matched = 0;

  // Format A: Tab-separated grid — find best header row
  const tabRows = lines.map(l=>l.split('\t'));
  const wideRows = tabRows.filter(r=>r.length>=3);
  if(wideRows.length>=2){
    let bestHdrIdx=-1, bestHdrScore=0;
    wideRows.forEach((row,i)=>{
      const score=row.filter(c=>bestMatch(c)!==null).length;
      if(score>bestHdrScore){bestHdrScore=score;bestHdrIdx=i;}
    });
    if(bestHdrScore>=2 && bestHdrIdx<wideRows.length-1){
      const hdr=wideRows[bestHdrIdx], data=wideRows[bestHdrIdx+1];
      hdr.forEach((h,i)=>{
        const field=bestMatch(h);
        const val=cleanVal(data[i]);
        if(field&&val){ if(applyToD(field,val)) matched++; }
      });
    }
  }

  // Format B: "Label: value" or "Label\tvalue" lines
  if(matched===0){
    lines.forEach(line=>{
      const ti=line.indexOf('\t'), ci=line.indexOf(':');
      let key='',val='';
      if(ti>0&&ti<60){key=line.substring(0,ti).trim();val=line.substring(ti+1).trim();}
      else if(ci>0&&ci<80){key=line.substring(0,ci).trim();val=line.substring(ci+1).trim();}
      if(!key||!val) return;
      val=cleanVal(val);
      if(!val||val.length<2) return;
      const field=bestMatch(key);
      if(field&&applyToD(field,val)) matched++;
    });
  }

  // Format C: Question/answer interleaved
  if(matched===0){
    for(let i=0;i<lines.length-1;i++){
      const maybeQ=lines[i].trim(), maybeA=lines[i+1].trim();
      if(!bestMatch(maybeQ)) continue;
      const field=bestMatch(maybeQ);
      if(!field) continue;
      const val=cleanVal(maybeA);
      if(val&&val.length>1&&!isQ(val)){ if(applyToD(field,val)){matched++;i++;} }
    }
  }

  if(matched===0){
    const preview=raw.substring(0,200).replace(/\t/g,'→').replace(/\n/g,'↵\n');
    alert('Could not auto-extract fields.\n\nData preview:\n'+preview+'\n\nTips:\n• Copy BOTH the header row AND data row from Smartsheet\n• Or use Label: Value format\n• Set an API key (🔑) for AI extraction of any format');
    return;
  }
  // Ensure BA Manager is always reset to fixed value
  D.baManager = FIXED_BA_MANAGER;
  render(); persist();
  showToast(`✓ Extracted ${matched} fields from Smartsheet data`);
}

function safeParseJSON(text){
  try{return JSON.parse(text);}catch(e){}
  const s=text.indexOf('{'),e2=text.lastIndexOf('}');
  if(s===-1||e2===-1||e2<=s) throw new Error('No JSON object found in response');
  let candidate=text.slice(s,e2+1);
  try{return JSON.parse(candidate);}catch(e){}
  for(let i=candidate.length-1;i>candidate.length*0.3;i--){
    const ch=candidate[i];
    if(ch==='}'||ch===']'||ch==='"'){
      try{
        let sub=candidate.slice(0,i+1);
        let braces=0,brackets=0,inStr=false,escape=false;
        for(let j=0;j<sub.length;j++){
          const c=sub[j];
          if(escape){escape=false;continue;}
          if(c==='\\'){escape=true;continue;}
          if(c==='"'&&!inStr) inStr=true;
          else if(c==='"'&&inStr) inStr=false;
          if(!inStr){if(c==='{'&&++braces);else if(c==='}'&&--braces);else if(c==='['&&++brackets);else if(c===']'&&--brackets);}
        }
        if(brackets>0) sub+=']'.repeat(brackets);
        if(braces>0) sub+='}'.repeat(braces);
        sub=sub.replace(/,\s*([}\]])/g,'$1');
        return JSON.parse(sub);
      }catch(e2){continue;}
    }
  }
  throw new Error('Could not parse or repair JSON response');
}

        description:r.description||'',businessValue:r.businessValue||'',
        acceptanceCriteria:r.acceptanceCriteria||'',actors:r.actors||'',
        stakeholder:r.stakeholder||'',preconditions:r.preconditions||'',
        postconditions:r.postconditions||'',context:[]
      }));
    }
    if(result.nfrs&&result.nfrs.length) D.nfrs=result.nfrs;
    if(result.risks&&result.risks.length) D.risks=result.risks;
    if(result.uatCases&&result.uatCases.length) D.uatCases=result.uatCases;

    render(); persist();
    showToast('✓ AI expanded BRD — review all sections');
    goto(2);
  }catch(e){
    alert('AI expansion error: '+e.message);
  }finally{
    btn.disabled=false;btn.innerHTML=orig;
  }
}

// ─── DOCUMENT UPLOAD / PARSE ──────────────────────────────────────────────────
function uploadDoc(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    let text=e.target.result;
    // RTF: strip control codes
    if(file.name.endsWith('.rtf')){
      text=text.replace(/\{[^}]*\}/g,'').replace(/\\[a-z]+\\-?[0-9]* ?/gi,'').replace(/[{}\\]/g,' ').replace(/\s+/g,' ').trim();
    }
    if(!text||text.length<10){alert('Could not read file. Try pasting the content instead.');input.value='';return;}
    const docName=file.name;
    input.value='';
    await parseDocContent(text,docName);
  };
  if(file.name.endsWith('.docx')||file.name.endsWith('.doc')){
    reader.readAsBinaryString(file);
  }else{
    reader.readAsText(file);
  }
}

function addDocManual(){
  const el=document.getElementById('paste-doc');
  const text=(el?.value||'').trim();
  if(!text){alert('Paste some content first');return;}
  D.documents.push({name:'Pasted Note — '+new Date().toLocaleDateString(),content:text});
  el.value='';
  render();persist();
  showToast('Note added');
}

async function parsePastedDoc(){
  const el=document.getElementById('paste-doc');
  const text=(el?.value||'').trim();
  if(!text){alert('Paste some content first');return;}
  await parseDocContent(text,'Meeting Notes — '+new Date().toLocaleDateString());
  el.value='';
}

async function parseDocContent(text,docName){
  const apiKey=localStorage.getItem('portico-api-key-v2');
  D.documents.push({name:docName,content:text.substring(0,2000)+(text.length>2000?'…':'')});

  if(!apiKey){render();persist();showToast('Document added (no AI key — manual review)');return;}

  const prompt=`Extract BRD-relevant content from this document for the initiative "${D.title||'current project'}". Focus on: requirements, constraints, risks, success criteria, stakeholders, scope.

Return ONLY a JSON object:
{
  "reqContext": [{"src":"${docName.substring(0,30)}","text":"extracted requirement or context"}],
  "scopeItems": ["additional in-scope items"],
  "outScopeItems": ["additional out-of-scope items"],
  "risks": [{"title":"risk","likelihood":"Medium","impact":"High","mitigation":"mitigation"}]
}

Document content:
${text.substring(0,3000)}`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if(!resp.ok) throw new Error('API '+resp.status);
    const data=await resp.json();
    const txt=data.content?.find(b=>b.type==='text')?.text||'';
    const result=safeParseJSON(txt);
    let merged=0;
    if(result.reqContext){
      result.reqContext.forEach(ctx=>{
        if(D.requirements.length&&ctx.text){
          D.requirements[D.requirements.length-1].context=D.requirements[D.requirements.length-1].context||[];
          D.requirements[D.requirements.length-1].context.push(ctx);
          merged++;
        }
      });
    }
    if(result.scopeItems) result.scopeItems.forEach(s=>{if(s&&!D.inScope.includes(s)) D.inScope.push(s);});
    if(result.outScopeItems) result.outScopeItems.forEach(s=>{if(s&&!D.outScope.includes(s)) D.outScope.push(s);});
    if(result.risks) result.risks.forEach(r=>{if(r.title) D.risks.push(r);});
    render();persist();
    showToast(`✓ Document parsed — ${merged} context items added`);
  }catch(e){
    render();persist();
    showToast('Document added (AI parse failed — manual review)','warn');
  }
}

{\\pard\\f0\\fs20\\sb100 ${e2(D.problem)}\\par}

\\par

${sHdr('3','Project Scope')}

  const blob=new Blob([rtf],{type:'application/rtf'});

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function persist(){
  try{localStorage.setItem(SAVED+'-current',JSON.stringify(D));}catch(e){}
}
function loadCurrent(){
  try{
    const s=localStorage.getItem(SAVED+'-current');
    if(s){const d=JSON.parse(s);D={...blankState(),...d};D.baManager=FIXED_BA_MANAGER;}
  }catch(e){}
}
function getSaved(){
  try{return JSON.parse(localStorage.getItem(SAVED)||'[]');}catch(e){return[];}
}
function saveBRD(){
  const name=prompt('Save BRD as:',D.title||'New BRD');
  if(!name) return;
  D.title=D.title||name;
  const saved=getSaved();
  saved.unshift({...JSON.parse(JSON.stringify(D)),savedAt:new Date().toISOString()});
  localStorage.setItem(SAVED,JSON.stringify(saved.slice(0,20)));
  showToast(`✓ Saved as "${name}"`);
  goto(5);
}
function loadSaved(i){const s=getSaved();if(s[i]){D={...blankState(),...s[i]};D.baManager=FIXED_BA_MANAGER;goto(1);}}
function loadAndDownload(i){loadSaved(i);setTimeout(downloadBRD,200);}
function deleteSaved(i){if(!confirm('Delete this BRD?')) return;const s=getSaved();s.splice(i,1);localStorage.setItem(SAVED,JSON.stringify(s));render();}
function newBRD(){if(!confirm('Start a new BRD? Unsaved changes will be lost.')) return;D=blankState();goto(1);}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function addReq(){
  D.requirements.push({id:'BRD-'+String(D.requirements.length+1).padStart(3,'0'),title:'',priority:'High',description:'',businessValue:'',acceptanceCriteria:'',actors:'',stakeholder:'',preconditions:'',postconditions:'',context:[]});
  render();
}
function renum(){
  D.requirements.forEach((r,i)=>{r.id='BRD-'+String(i+1).padStart(3,'0');});
}

// ─── API KEY ─────────────────────────────────────────────────────────────────
function setApiKey(){
  const current=localStorage.getItem('portico-api-key-v2')||'';
  const key=prompt('Enter your Anthropic API key (sk-ant-...):\n\nThis enables AI field extraction and AI BRD expansion. Leave blank to clear.',current);
  if(key===null) return;
  if(key){
    localStorage.setItem('portico-api-key-v2',key.trim());
    document.getElementById('api-badge').classList.add('has-key');
    document.getElementById('api-label').textContent='API Key ✓';
    showToast('✓ API key saved');
  }else{
    localStorage.removeItem('portico-api-key-v2');
    document.getElementById('api-badge').classList.remove('has-key');
    document.getElementById('api-label').textContent='Set API Key';
    showToast('API key cleared');
  }
}

function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='warn'?'#a0601a':type==='err'?'#8a0023':'#2d5a27';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  loadCurrent();
  if(localStorage.getItem('portico-api-key-v2')){
    document.getElementById('api-badge').classList.add('has-key');
    document.getElementById('api-label').textContent='API Key ✓';
  }
  render();
});
